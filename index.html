<!DOCTYPE html>
<html lang="sl">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>Odbojka Preserje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f5f2; --surface:#ffffff; --ink:#17211c; --mute:#5c6a62; --line:#d6ded8;
  --board:#1f3a31; --board-ink:#eef3e6; --chalk:#f0dc82;
  --acc:#2f6f57; --acc-ink:#ffffff; --soft:#e4efe8;
  --ta:#c03d68; --ta-soft:#fbe9ef; --tb:#a86c12; --tb-soft:#f8efdd; --err:#b42318;
  --ok:#2e8b4f; --low:#c7781a;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#161f1b; --ink:#e5ece7; --mute:#93a299; --line:#2a3731;
  --board:#14271f; --board-ink:#e9efe2; --chalk:#e8d27a;
  --acc:#69bf98; --acc-ink:#0f1512; --soft:#1d2c25;
  --ta:#ee86a7; --ta-soft:#2c1a21; --tb:#e2ad4d; --tb-soft:#2a2217; --err:#ff8a7a;
  --ok:#4fc37c; --low:#e59a3c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#161f1b; --ink:#e5ece7; --mute:#93a299; --line:#2a3731;
  --board:#14271f; --board-ink:#e9efe2; --chalk:#e8d27a;
  --acc:#69bf98; --acc-ink:#0f1512; --soft:#1d2c25;
  --ta:#ee86a7; --ta-soft:#2c1a21; --tb:#e2ad4d; --tb-soft:#2a2217; --err:#ff8a7a;
  --ok:#4fc37c; --low:#e59a3c; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body)}
.wrap{max-width:1080px;margin:0 auto;padding-left:16px;padding-right:16px}
.top{background:var(--board);color:var(--board-ink)}
.top .wrap{padding-block:18px 0;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.brand h1{font:700 30px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;margin:0}
.brand .sub{color:var(--chalk);font-size:14px;flex:1}
.brand .login,.hrow2 .login{background:transparent;color:var(--board-ink);border:1px solid #ffffff44;border-radius:6px;padding:4px 10px;font:500 13px var(--f-body);cursor:pointer}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{font:600 15px var(--f-body);background:transparent;color:var(--board-ink);opacity:.75;border:0;padding:10px 14px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{background:var(--bg);color:var(--ink);opacity:1}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{padding-block:20px 40px;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
h2{font:700 19px/1.2 var(--f-display);letter-spacing:.05em;text-transform:uppercase;margin:0}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.mute{color:var(--mute);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font:600 12px/1.2 var(--f-body);color:var(--mute);text-transform:uppercase;letter-spacing:.04em;vertical-align:bottom;white-space:normal;min-width:56px}
thead th button{all:unset;cursor:pointer}
thead th:first-child{min-width:140px}
tbody tr:hover td{background:var(--soft)}
td.pos{text-align:center}
.pill{display:inline-block;min-width:26px;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--acc);font-weight:600;text-align:center}
.pill.p1{background:var(--chalk);color:#3b3110}
tfoot td{font-weight:600;border-top:2px solid var(--ink);border-bottom:0}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
input[type=text],input[type=password],input[type=date],input[type=number]{font:inherit;color:var(--ink);background:var(--surface);padding:6px 8px;border:1px solid var(--line);border-radius:6px}
input[type=number]{width:62px;text-align:center;font-variant-numeric:tabular-nums}
.btn{font:600 14px var(--f-body);background:var(--acc);color:var(--acc-ink);border:1px solid var(--acc);border-radius:7px;padding:8px 14px;cursor:pointer}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.warn{background:var(--err);border-color:var(--err);color:#fff}
.btn.link{background:transparent;border-color:transparent;color:var(--err);padding:4px 8px}
.btn[disabled]{opacity:.5;cursor:default}
.last{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:4px 14px;align-items:start}
.last .team{display:flex;flex-direction:column;gap:2px;min-width:0}
.last .team.b{text-align:right}
.last .tname{font:700 22px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.last .names{font-size:13px;color:var(--mute)}
.last .score{text-align:center;font:700 40px/1 var(--f-display);font-variant-numeric:tabular-nums}
.last .sets{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-variant-numeric:tabular-nums}
.last .sets span{border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:14px}
.tA{color:var(--ta)} .tB{color:var(--tb)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px}
.p{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:4px 6px;min-width:0}
.p.A{background:var(--ta-soft);border-color:var(--ta)} .p.B{background:var(--tb-soft);border-color:var(--tb)}
.p .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex}
.seg button{font:600 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:3px 0;width:30px;cursor:pointer}
.seg button:first-child{border-radius:5px 0 0 5px}.seg button:last-child{border-radius:0 5px 5px 0}
.seg button.onA{background:var(--ta);border-color:var(--ta);color:#fff}
.seg button.onB{background:var(--tb);border-color:var(--tb);color:#fff}
.seg button.onP{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.p.P{background:var(--soft);border-color:var(--acc)}
.teams .P{background:var(--soft)}
select{font:inherit;color:var(--ink);background:var(--surface);padding:6px 8px;border:1px solid var(--line);border-radius:6px;max-width:100%}
.meter{display:inline-block;vertical-align:middle;width:60px;height:8px;border-radius:4px;background:var(--soft);margin-left:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc)}
.hint{font-size:13px;color:var(--mute);margin:10px 0 0}
.suggest{border:1px solid var(--acc);background:var(--soft);border-radius:8px;padding:8px 10px;font-size:14px;margin-top:10px}
.jolly{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:2px}
.teams{display:grid;gap:6px;margin-top:12px}
.teams div{border-radius:7px;padding:8px 10px;font-size:14px}
.teams .A{background:var(--ta-soft)} .teams .B{background:var(--tb-soft)}
.setsT td,.setsT th{text-align:center}
.result{font:700 34px/1 var(--f-display);text-align:center;margin:12px 0;font-variant-numeric:tabular-nums;min-height:34px}
.match{display:flex;flex-direction:column;gap:4px;padding-block:12px;border-top:1px solid var(--line)}
.match:first-child{border-top:0;padding-top:0}
.notice{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--mute)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--chalk);color:#3b3110;border-radius:8px;padding:10px 12px}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:7px;font-size:14px;max-width:calc(100% - 32px);opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.toast.err{background:var(--err);color:#fff}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
/* ---------- prisotnost ---------- */
.termini{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 13px var(--f-body);cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{font-weight:500;opacity:.75;margin-left:4px}
.chip.off{text-decoration:line-through;opacity:.6}
.when{font:700 24px/1.15 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.meter12{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px;margin-top:10px}
.gnum{font:700 52px/0.9 var(--f-display);font-variant-numeric:tabular-nums}
.gnum small{font-size:22px;color:var(--mute)}
.gauge{flex:1 1 260px;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px}
.gauge i{height:26px;border-radius:4px;background:var(--soft);border:1px solid var(--line)}
.gauge i.da{background:var(--low);border-color:var(--low)}
.gauge.ok i.da{background:var(--ok);border-color:var(--ok)}
.gauge i.mog{background:repeating-linear-gradient(45deg,var(--soft) 0 4px,var(--line) 4px 8px)}
.gauge i.cap{box-shadow:3px 0 0 var(--ink)}
.status{font-weight:600;margin-top:8px}
.status.ok{color:var(--ok)} .status.low{color:var(--low)}
.legend{font-size:12px;color:var(--mute);margin:0 0 8px}
.rsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.rs{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:8px;padding:5px 6px;min-width:0}
.rs.st-DA{border-color:var(--ok)} .rs.st-NE{opacity:.7} .rs.st-MOGOCE{border-color:var(--low)}
.rs.me{box-shadow:0 0 0 2px var(--ink) inset}
.rs .n{font-size:13px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.rsb button{font:700 14px/1 var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 0;cursor:pointer}
.rsb button + button{border-left:0}
.rsb button:first-child{border-radius:5px 0 0 5px}.rsb button:last-child{border-radius:0 5px 5px 0}
.rsb button.on-DA{background:var(--ok);border-color:var(--ok);color:#fff}
.rsb button.on-MOGOCE{background:var(--low);border-color:var(--low);color:#fff}
.rsb button.on-NE{background:var(--err);border-color:var(--err);color:#fff}
.rsb button.on-J{background:var(--chalk);border-color:var(--chalk);color:#3b3110}
.rs .note{font-size:11.5px;font-style:italic;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-2px}
.notebox{margin:0 0 10px} .notebox .row{flex-wrap:nowrap} .notebox input{flex:1;min-width:0}
.prisgrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:16px;align-items:start}
.pcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.chatcol{position:sticky;top:12px}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:min(60vh,520px);overflow-y:auto;padding:2px 2px 6px}
.msg{background:var(--soft);border-radius:10px 10px 10px 2px;padding:6px 9px;max-width:92%;align-self:flex-start}
.msg.mine{background:var(--ta-soft);border-radius:10px 10px 2px 10px;align-self:flex-end}
.msg .mh{display:flex;align-items:center;gap:6px;font-size:12px}
.msg .mh span{color:var(--mute)} .msg .mh .btn{padding:0 4px;margin-left:auto;font-size:12px}
.msg .mt{font-size:14px;overflow-wrap:anywhere}
.composer{display:flex;flex-direction:column;gap:6px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.composer .row{flex-wrap:nowrap} .composer input{flex:1;min-width:0}
.qbtn{width:28px;height:28px;border-radius:50%;border:1px solid #ffffff66;background:transparent;color:var(--board-ink);font:600 15px/1 var(--f-body);cursor:pointer;flex:none}
.qbtn.qinline{width:22px;height:22px;font-size:12px;border-color:currentColor;color:inherit;vertical-align:middle}
.banner{background:var(--chalk);color:#3b3110;border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:10px;line-height:1.5}
.banner .bh{display:flex;justify-content:space-between;align-items:center}
.banner .btn.link{color:#3b3110;padding:2px 6px}
.banner .bok{font-weight:700;padding-left:0!important;margin-top:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);color:var(--ink);border-radius:14px;padding:16px 18px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;font-size:14px;line-height:1.5}
.sheet section{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.sheet h3{font:700 16px var(--f-display);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
.sheet ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.sheet .hl{color:var(--mute);margin-top:2px}
.sheet .okline{background:var(--soft);color:var(--ok);border-radius:6px;padding:6px 9px;margin:8px 0 4px;font-weight:600}
.sheet dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
.sheet dt{font-weight:600;white-space:nowrap} .sheet dd{margin:0;color:var(--mute)}
@media (max-width:640px){ .modal{align-items:flex-end;padding:0} .sheet{border-radius:14px 14px 0 0;max-height:85vh} .sheet dl{grid-template-columns:1fr} .sheet dd{margin-bottom:4px} }
.homegrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){ .homegrid{grid-template-columns:minmax(0,1fr)} }
.hcard{display:flex;flex-direction:column;gap:6px}
.lb{font:600 11.5px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hbig{font:700 20px/1.1 var(--f-display);letter-spacing:.02em}
.hnum{font:700 30px/1 var(--f-display);font-variant-numeric:tabular-nums} .hnum small{font-size:16px;color:var(--mute)}
.gauge.mini{flex:none;margin:2px 0 4px} .gauge.mini i{height:14px}
.hres{font:700 20px var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.hscore{font-size:34px;color:var(--ink);font-variant-numeric:tabular-nums}
.hlink{color:var(--acc)!important;align-self:flex-start;padding:4px 0!important}
.fun{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.fun > div{background:var(--soft);border-radius:8px;padding:9px 11px}
.fun .t{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
.fun .v{font-weight:600;margin-top:3px;line-height:1.3}
.fun .s{font-size:12.5px;color:var(--mute)}
@media (max-width:640px){ .hbig{font-size:18px}
  .fun{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;padding-bottom:6px;-webkit-overflow-scrolling:touch}
  .fun > div{flex:0 0 72%;scroll-snap-align:start} }
.offbar{background:var(--tb-soft);color:var(--err);border:1px solid var(--err);border-radius:8px;padding:8px 12px;margin:0 0 12px;font-weight:600}
.mystat .rsb{display:inline-grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.mystat .rsb button{min-width:44px;height:36px}
.wg{font-size:13.5px;line-height:1.4} .wg b{margin-right:4px} .wg.none{color:var(--mute)}
.form{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.form i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.form .fW{background:var(--ok)} .form .fL{background:var(--err)} .form .fD{background:var(--mute)}
.bars{display:flex;align-items:flex-end;gap:3px;height:52px;margin:2px 0 0;position:relative;padding-bottom:16px}
.bars::after{content:"";position:absolute;left:0;right:0;border-top:1px dashed var(--mute);bottom:calc(16px + (100% - 16px) * var(--t));pointer-events:none}
.bc{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.bc i{display:block;width:100%;background:var(--low);border-radius:3px 3px 0 0;min-height:2px} .bc i.ok{background:var(--ok)}
.bc .bn{display:none} .bc .bd{position:absolute;bottom:-16px;font-size:9.5px;color:var(--mute);white-space:nowrap}
.hbtns{display:inline-flex;align-items:center;gap:8px;margin-left:auto}
.brand{flex-wrap:nowrap!important;align-items:center!important}
.brand h1{min-width:0}
.hrow2{display:flex;align-items:center;gap:10px;min-height:0}
.hrow2:empty{display:none}
.hrow2 .chatflag-row{flex:1 1 auto;flex-basis:auto}
.hrow2 .login{margin-left:auto}
@media (max-width:640px){ .top .wrap{gap:10px} .brand h1{font-size:22px!important} .mebtn{max-width:120px} }
.mebtn{background:#ffffff1a;color:var(--board-ink);border:1px solid #ffffff44;border-radius:999px;padding:4px 11px;font:600 13px var(--f-body);cursor:pointer;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mebtn.go{background:var(--chalk);color:#3b3110;border-color:var(--chalk)}
.meunk{font-size:13px;opacity:.75}
.wholist{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.wholist .btn{text-align:left;padding:10px 12px} .wholist .btn.on{border-color:var(--acc);background:var(--soft)}
.ptab .pn input{width:min(260px,100%)}
.mob-txt{display:none}
@media (max-width:640px){
  .desk-txt{display:none} .mob-txt{display:inline}
  .ptab, .ptab tbody{display:block}
  .ptab tr{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding:4px 0}
  .ptab td{border:0;padding:2px}
  .ptab td.pn{flex:1;min-width:0} .ptab .pn input{width:100%}
  .ptab input[type=checkbox]{width:20px;height:20px}
  .ptab .plink{padding:7px 10px}
}
.chbox{border:1px dashed var(--acc);border-radius:8px;padding:8px 10px;margin-top:10px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.chrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chn{color:var(--mute);font-style:italic;font-size:.92em}
.chline{font-size:13px;color:var(--acc);margin-top:2px}
.logT td{white-space:normal;text-align:left} .logT td:first-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.byother{color:var(--low);font-weight:600;font-size:12.5px}
.lgter{margin-top:14px} .lgter h3{font:700 15px var(--f-display);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
.lgp{border:1px solid var(--line);border-radius:8px;margin-bottom:6px;padding:0 10px}
.lgp summary{display:flex;gap:8px;align-items:center;padding:9px 0;cursor:pointer;list-style:none}
.lgp summary::-webkit-details-marker{display:none}
.lgp summary b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lgp .now{font-size:12px;background:var(--soft);border-radius:999px;padding:2px 8px;white-space:nowrap}
.lgp ol{margin:0 0 8px;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.sheet.confirm{max-width:380px;text-align:center}
.sheet.confirm h2{margin-bottom:8px}
.cbody{font-size:15px} .cbody .who{margin:10px 0 0;font-size:14px;color:var(--mute)} .cbody .who b{color:var(--ink)}
.cbody .warnline{display:inline-block;color:var(--low);font-weight:600;margin-bottom:4px}

<script>
/* Povezava s Supabase. Zamenjaj oba podatka (Supabase -> Project Settings -> API); anon ključ je javen in je tak namenjen. */
var SB_URL = "https://buclbyhlozjhdrxljekn.supabase.co/rest/v1/";
var SB_KEY = "sb_secret_eA0OvhGb4kVf9vdBRITtUQ_F5ZRhP3W";
/* Spodaj je tanka plast, ki klice iz aplikacije (nekdanji google.script.run) pošilja v Supabase. Ostala koda je enaka kot pri Googlu. */
(function(){
  function names(v){ return String(v || "").split(",").map(function(s){ return s.trim(); }).filter(Boolean); }
  function sets(v){ return String(v || "").split(",").map(function(s){ return s.trim(); }).filter(Boolean).map(function(s){ return s.split(":").map(function(x){ return Number(x.trim()) || 0; }); }); }
  function shape(d){
    var rsvp = {}, rj = {}, rn = {}, chat = {};
    (d.rsvp || []).forEach(function(r){
      (rsvp[r.d] = rsvp[r.d] || {})[r.n] = r.o;
      if (r.o === "DA" && r.j) (rj[r.d] = rj[r.d] || {})[r.n] = true;
      if (r.note) (rn[r.d] = rn[r.d] || {})[r.n] = r.note;
    });
    (d.chat || []).forEach(function(c){ (chat[c.d] = chat[c.d] || []).push({ id: c.id, name: c.name, text: c.text, time: c.time }); });
    return { players: d.players, rsvp: rsvp, rsvpJolly: rj, rsvpNote: rn, chat: chat, skipped: d.skipped || [], today: d.today,
      url: location.origin + location.pathname,
      matches: d.matches.map(function(m){ return { id: m.id, date: m.date, teamA: m.teamA, teamB: m.teamB, a: names(m.a), b: names(m.b), jolly: names(m.jolly), sets: sets(m.sets), ch: String(m.ch || "").trim() }; }) };
  }
  function matchRow(m){
    return { id: m.id || "", date: m.date, teamA: m.teamA, teamB: m.teamB, a: m.a.join(", "), b: m.b.join(", "), jolly: (m.jolly || []).join(", "),
      sets: m.sets.map(function(s){ return s[0] + ":" + s[1]; }).join(", "), ch: m.ch || "" };
  }
  var API = {
    getData:       ["get_data", [], shape],
    getLog:        ["get_log", ["p_pw"]],
    checkPassword: ["check_password", ["p_pw"]],
    setRsvp:       ["set_rsvp", ["p_datum", "p_ime", "p_odgovor", "p_jolly", "p_by"], shape],
    setNote:       ["set_note", ["p_datum", "p_ime", "p_note", "p_by"], shape],
    addChat:       ["add_chat", ["p_datum", "p_ime", "p_text"], shape],
    deleteChat:    ["delete_chat", ["p_pw", "p_id"], shape],
    setSkip:       ["set_skip", ["p_pw", "p_datum", "p_skip", "p_note"], shape],
    saveMatch:     ["save_match", ["p_pw", "m"], shape, function(a){ a[1] = matchRow(a[1]); return a; }],
    deleteMatch:   ["delete_match", ["p_pw", "p_id"], shape],
    savePlayers:   ["save_players", ["p_pw", "p_players", "p_renames"], shape]
  };
  function rpc(fn, args){
    var d = API[fn]; if (!d) return Promise.reject(new Error("Neznana funkcija " + fn));
    var a = (d[3] ? d[3](args.slice()) : args), body = {};
    d[1].forEach(function(k, i){ body[k] = a[i] === undefined ? null : a[i]; });
    return fetch(SB_URL + "/rest/v1/rpc/" + d[0], { method: "POST", headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .catch(function(){ throw new Error("Ni povezave s strežnikom. Poskusi znova."); })
      .then(function(r){ return r.json().catch(function(){ return null; }).then(function(j){
        if (!r.ok) throw new Error((j && j.message) || "Napaka strežnika (" + r.status + ").");
        return d[2] ? d[2](j) : j; }); });
  }
  window.google = { script: {
    get run(){
      var ok = function(){}, fail = function(){};
      var p = new Proxy({}, { get: function(t, k){
        if (k === "withSuccessHandler") return function(f){ ok = f; return p; };
        if (k === "withFailureHandler") return function(f){ fail = f; return p; };
        return function(){ rpc(k, [].slice.call(arguments)).then(function(v){ ok(v); }, function(e){ fail(e); }); };
      } });
      return p;
    },
    url: { getLocation: function(cb){ var o = {}; new URLSearchParams(location.search).forEach(function(v, k){ o[k] = v; }); cb({ parameter: o, hash: location.hash.replace(/^#/, "") }); } },
    history: { replace: function(state, params, hash){ var q = new URLSearchParams(params || {}).toString(); history.replaceState(null, "", location.pathname + (q ? "?" + q : "") + (hash ? "#" + hash : "")); } }
  } };
})();

<script>
(function(){
"use strict";
var PW_KEY = "odbojka-geslo";
var VERSION = "S1 (Supabase)"; // ob vsaki spremembi povečaj, da vidiš, ali je objavljena nova koda
var db = { players: [], matches: [], allMatches: [], drafts: [], rsvp: {}, rsvpJolly: {}, rsvpNote: {}, chat: {}, skipped: [] }, loaded = false, loadErr = "";
var pw = null, canWrite = false, busy = false, dirty = false, showLogin = false;
var tab = "home";
try { pw = sessionStorage.getItem(PW_KEY); } catch (e) {}

/* ---------- pomožne ---------- */
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function fmt(x,d){ return x.toFixed(d).replace(".", ","); }
function dateSl(d){ var p = d.split("-"); return p.length === 3 ? +p[2] + ". " + +p[1] + ". " + p[0] : d; }
function byName(a,b){ return a.name.localeCompare(b.name, "sl"); }
function today(){ var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth()+1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
var toastT;
function toast(t, err){ var e = $("#toast"); e.textContent = t; e.className = "toast show" + (err ? " err" : ""); clearTimeout(toastT); toastT = setTimeout(function(){ e.className = "toast" + (err ? " err" : ""); }, 2800); }
function validSets(m){ return m.sets.filter(function(s){ return (+s[0]||0) + (+s[1]||0) > 0 && +s[0] !== +s[1]; }); }
function errMsg(e){ return (e && e.message ? e.message : String(e)).replace(/^Error:\s*/, ""); }

/* ---------- strežnik ---------- */
function fromServer(d){
  db.players = d.players.map(function(p){ return { name: p.name, active: p.active, orig: p.name }; });
  db.allMatches = d.matches.map(function(m){
    var pl = {};
    m.a.forEach(function(n){ pl[n] = { t: "A", j: false }; });
    m.b.forEach(function(n){ pl[n] = { t: "B", j: false }; });
    m.jolly.forEach(function(n){ if (pl[n]) pl[n].j = true; });
    parseCh(m.ch, pl);
    return { id: m.id, date: m.date, teamA: m.teamA, teamB: m.teamB, players: pl, sets: m.sets };
  });
  // Statistika, lestvica in aktualni termin upoštevajo samo odigrane tekme (z vsaj enim setom).
  // Tekma brez setov = shranjene ekipe, rezultat bo vpisan kasneje.
  db.matches = db.allMatches.filter(function(m){ return validSets(m).length; });
  db.drafts = db.allMatches.filter(function(m){ return !validSets(m).length; });
  db.rsvp = d.rsvp || {};
  db.skipped = d.skipped || [];
  db.rsvpJolly = d.rsvpJolly || {};
  db.rsvpNote = d.rsvpNote || {};
  db.chat = d.chat || {};
  db.url = d.url || "";
  db.today = d.today || today();
  loaded = true; dirty = false;
}
function toServer(m){
  var a = [], b = [], j = [];
  Object.keys(m.players).forEach(function(n){ var i = m.players[n]; (i.t === "A" ? a : b).push(n); if (i.j) j.push(n); });
  return { id: m.id || "", date: m.date, teamA: m.teamA, teamB: m.teamB, a: a, b: b, jolly: j, sets: m.sets, ch: serCh(m.players) };
}

/* ---------- menjave med tekmo ----------
   Vsak igralec ima začetno ekipo t ("A"/"B"), po želji from = prvi set, ki ga je igral (kasnejši prihod),
   in mv = [{s: set, t: ekipa}] = od seta s naprej igra v ekipi t (zamenjava ali premik).
   Zapis v tabeli: "Riči>B@3; Blaž>A@3; Tim+@2". */
function parseCh(str, pl){
  String(str || "").split(";").map(function(x){ return x.trim(); }).filter(Boolean).forEach(function(x){
    var a = /^(.*?)>([AB])@(\d+)$/.exec(x), b = /^(.*?)\+@(\d+)$/.exec(x);
    if (a && pl[a[1]]) (pl[a[1]].mv = pl[a[1]].mv || []).push({ s: +a[3], t: a[2] });
    else if (b && pl[b[1]]) pl[b[1]].from = +b[2];
  });
  Object.keys(pl).forEach(function(n){ if (pl[n].mv) pl[n].mv.sort(function(x,y){ return x.s - y.s; }); });
}
function serCh(pl){
  var out = [];
  Object.keys(pl).forEach(function(n){
    var i = pl[n]; if (i.t !== "A" && i.t !== "B") return;
    if (i.from > 1) out.push(n + "+@" + i.from);
    (i.mv || []).forEach(function(v){ out.push(n + ">" + v.t + "@" + v.s); });
  });
  return out.join("; ");
}
// Ekipa igralca v setu z indeksom i (0 = prvi set); "" = v tem setu ni igral.
function teamAt(info, i){
  var s = i + 1; if (info.from && s < info.from) return "";
  var t = info.t; (info.mv || []).forEach(function(v){ if (s >= v.s) t = v.t; });
  return t === "A" || t === "B" ? t : "";
}
function otherT(t){ return t === "A" ? "B" : "A"; }
// Kratek opis menjav igralca, npr. "od 2. seta" ali "→ Suhi od 3. seta".
function chNote(m, n){
  var i = m.players[n], parts = [];
  if (i.from > 1) parts.push("od " + i.from + ". seta");
  (i.mv || []).forEach(function(v){ parts.push("→ " + (v.t === "A" ? m.teamA : m.teamB) + " od " + v.s + ". seta"); });
  return parts.join(", ");
}
// Seznam menjav tekme za prikaz; zamenjavi v istem setu v nasprotni smeri združi v "A ↔ B".
function chList(m){
  var mv = [], out = [];
  Object.keys(m.players).forEach(function(n){ var i = m.players[n];
    if (i.from > 1) out.push({ s: i.from, txt: esc(n) + " pride od " + i.from + ". seta", n: n, kind: "from" });
    (i.mv || []).forEach(function(v){ mv.push({ n: n, s: v.s, t: v.t }); }); });
  var used = {};
  mv.forEach(function(a, x){ if (used[x]) return;
    var y = mv.findIndex(function(b, k){ return !used[k] && k !== x && b.s === a.s && b.t === otherT(a.t); });
    if (y >= 0) { used[x] = used[y] = 1; out.push({ s: a.s, txt: esc(a.n) + " ↔ " + esc(mv[y].n) + " od " + a.s + ". seta", n: a.n, n2: mv[y].n, kind: "swap" }); }
    else { used[x] = 1; out.push({ s: a.s, txt: esc(a.n) + " → " + esc(a.t === "A" ? m.teamA : m.teamB) + " od " + a.s + ". seta", n: a.n, kind: "move" }); }
  });
  return out.sort(function(a,b){ return a.s - b.s; });
}
function call(fn, args, okMsg, nextTab){
  busy = true; render();
  var r = google.script.run
    .withSuccessHandler(function(d){
      busy = false; fromServer(d);
      if (fn === "saveMatch" || fn === "deleteMatch" || form.auto) newForm();   // nov aktualni termin + njegove prijave
      if (nextTab) tab = nextTab; toast(okMsg); render();
    })
    .withFailureHandler(function(e){
      busy = false; var m = errMsg(e);
      if (/geslo/i.test(m)) logout();
      toast(m || "Shranjevanje ni uspelo. Poskusi znova.", true); render();
    });
  r[fn].apply(r, args);
}
function load(){
  google.script.run
    .withSuccessHandler(function(d){ fromServer(d); if (!form.id) newForm(); render(); })
    .withFailureHandler(function(e){ if (!loaded) loadErr = errMsg(e); render(); })
    .getData();
}
function login(p){
  google.script.run.withSuccessHandler(function(ok){
    if (!ok) { toast("Napačno geslo.", true); return; }
    pw = p; canWrite = true; showLogin = false;
    try { sessionStorage.setItem(PW_KEY, p); } catch (e) {}
    toast("Prijavljen za vnos"); render();
  }).withFailureHandler(function(e){ toast(errMsg(e), true); }).checkPassword(p);
}
function logout(){ pw = null; canWrite = false; try { sessionStorage.removeItem(PW_KEY); } catch (e) {} }

/* ---------- statistika (kot Excel) ---------- */
var fOd = "", fDo = "", sortKey = "ratio", sortDir = -1;
var COLS = [["name","Igralec"],["sets","Total setov"],["pts","Sum vseh pik"],["won","Dobljeni seti"],["visits","Obiski"],
  ["ratio","Razmerje dob/odig"],["pos","Pozicija"],["avg","Avg / igran set"],["jolly","Jolly"],["tot","Tot + obisk"]];
function computeStats(all){
  var st = {};
  var phone = all || (window.matchMedia && window.matchMedia("(max-width: 640px)").matches); // na telefonu (in na Domov) vedno vse tekme
  var od = phone ? "" : fOd, dDo = phone ? "" : fDo;
  db.matches.filter(function(m){ return (!od || m.date >= od) && (!dDo || m.date <= dDo); }).forEach(function(m){
    var sets = validSets(m);
    Object.keys(m.players).forEach(function(n){
      var info = m.players[n];
      var s = st[n] || (st[n] = { name: n, sets: 0, pts: 0, won: 0, dates: {}, jolly: 0 });
      s.dates[m.date] = 1; if (info.j) s.jolly++;
      sets.forEach(function(x, i){   // vsak set šteje v ekipo, v kateri je igralec takrat igral
        var t = teamAt(info, i); if (!t) return;
        var mine = t === "A" ? 0 : 1;
        s.sets++; s.pts += +x[mine]; if (+x[mine] > +x[1-mine]) s.won++;
      });
    });
  });
  var rows = Object.keys(st).map(function(k){
    var s = st[k], v = Object.keys(s.dates).length;
    return { name: s.name, sets: s.sets, pts: s.pts, won: s.won, visits: v, ratio: s.sets ? s.won/s.sets : 0,
      avg: s.sets ? s.pts/s.sets : 0, jolly: s.jolly, tot: s.won + v };
  });
  var wonVals = rows.map(function(r){ return r.won; }).filter(function(v,i,a){ return a.indexOf(v) === i; }).sort(function(a,b){ return b-a; });
  rows.forEach(function(r){ r.pos = wonVals.indexOf(r.won) + 1; });
  return rows.sort(function(a,b){
    if (sortKey === "name") return sortDir * byName(a,b);
    return sortDir * (a[sortKey] - b[sortKey]) || (b.ratio - a.ratio) || (b.won - a.won) || byName(a,b);
  });
}
function teamList(m, t, withJ){
  return Object.keys(m.players).filter(function(n){ return m.players[n].t === t; })
    .map(function(n){ var cn = chNote(m, n);
      return esc(n) + (withJ && m.players[n].j ? " (J)" : "") + (cn ? ' <i class="chn">(' + esc(cn) + ")</i>" : ""); }).join(", ");
}
function lastMatchHTML(){
  var m = db.matches[db.matches.length - 1]; if (!m) return "";
  var wa = m.sets.filter(function(s){ return s[0] > s[1]; }).length, wb = m.sets.length - wa;
  var sa = m.sets.reduce(function(t,s){ return t + s[0]; }, 0), sb = m.sets.reduce(function(t,s){ return t + s[1]; }, 0);
  return '<section class="panel"><div class="head"><h2>Zadnji krog</h2><span class="mute">' + dateSl(m.date) + '</span></div>'
    + '<div class="last"><div class="team"><span class="tname tA">' + esc(m.teamA) + '</span><span class="names">' + teamList(m,"A") + '</span></div>'
    + '<div class="score"><span class="tA">' + wa + '</span> : <span class="tB">' + wb + '</span></div>'
    + '<div class="team b"><span class="tname tB">' + esc(m.teamB) + '</span><span class="names">' + teamList(m,"B") + '</span></div>'
    + '<div class="sets">' + m.sets.map(function(s){ return "<span>" + s[0] + " : " + s[1] + "</span>"; }).join("") + '<span><b>Σ ' + sa + " : " + sb + '</b></span></div></div></section>';
}
function statCardsHTML(rows, T){
  var k = sortKey === "name" || sortKey === "pos" ? "tot" : sortKey;
  var label = COLS.filter(function(c){ return c[0] === k; })[0][1];
  var val = function(r){ return k === "ratio" ? fmt(r.ratio,3) : k === "avg" ? fmt(r.avg,2) : r[k]; };
  return '<div class="mobile"><label class="f" style="margin-bottom:6px">Razvrsti po<select id="sortSel">'
    + COLS.map(function(c){ return '<option value="' + c[0] + '"' + (c[0] === sortKey ? " selected" : "") + ">" + c[1] + "</option>"; }).join("") + "</select></label>"
    + '<div class="cards">' + (rows.length ? rows.map(function(r){
        return '<div class="card"><span class="pill' + (r.pos === 1 ? " p1" : "") + '" title="Pozicija">' + r.pos + '</span><span class="nm">' + esc(r.name) + "</span>"
          + '<span class="big">' + val(r) + "<small>" + label + "</small></span>"
          + '<span class="det">' + r.sets + " setov · " + r.won + " dobljenih (" + fmt(r.ratio,3) + ") · " + r.visits + " obiskov · avg " + fmt(r.avg,2)
          + (r.jolly ? " · J " + r.jolly : "") + " · Tot " + r.tot + "</span></div>";
      }).join("") : '<p class="mute">V izbranem obdobju ni tekem.</p>') + "</div>"
    + '<div class="sum">Skupaj: ' + T.sets + " setov · " + T.pts + " pik · " + T.visits + " obiskov · Tot " + T.tot + "</div></div>";
}
function statHTML(){
  var rows = computeStats();
  var T = rows.reduce(function(t,r){ ["sets","pts","won","visits","jolly","tot"].forEach(function(k){ t[k] += r[k]; }); return t; }, {sets:0,pts:0,won:0,visits:0,jolly:0,tot:0});
  var body = rows.length ? rows.map(function(r){
    return "<tr><td>" + esc(r.name) + "</td><td>" + r.sets + "</td><td>" + r.pts + "</td><td>" + r.won + "</td><td>" + r.visits + "</td><td>" + fmt(r.ratio,3)
      + '</td><td class="pos"><span class="pill' + (r.pos === 1 ? " p1" : "") + '">' + r.pos + "</span></td><td>" + fmt(r.avg,2) + "</td><td>" + (r.jolly || "") + "</td><td><b>" + r.tot + "</b></td></tr>";
  }).join("") : '<tr><td colspan="10" class="mute">V izbranem obdobju ni tekem.</td></tr>';

function pairKey(a,b){ return a < b ? a + "|" + b : b + "|" + a; }
function pairStats(){
  var P = {};
  db.matches.forEach(function(m){
    var v = validSets(m), names = Object.keys(m.players);
    for (var i = 0; i < names.length; i++) for (var j = i + 1; j < names.length; j++) {
      var a = names[i], b = names[j], k = pairKey(a,b), pa = m.players[a], pb = m.players[b];
      var s = P[k] || (P[k] = { a: a < b ? a : b, b: a < b ? b : a, with: 0, sets: 0, won: 0, vs: 0 });
      // Po setih: skupaj v ekipi ali drug proti drugemu (menjave med tekmo so upoštevane).
      var tog = false, opp = false;
      v.forEach(function(x, si){
        var ta = teamAt(pa, si), tb = teamAt(pb, si); if (!ta || !tb) return;
        if (ta === tb) { tog = true; s.sets++; var mine = ta === "A" ? 0 : 1; if (+x[mine] > +x[1-mine]) s.won++; }
        else opp = true;
      });
      if (tog) s.with++;
      if (opp) s.vs++;
    }
  });
  return P;
}
var pairSel = "";

/* ---------- predlog ekip ---------- */
var suggestInfo = "";
// Moč igralca 0–1: 70 % razmerje dobljenih setov, 30 % povprečje pik na set. Novinec ≈ 0,5.
function ratings(){
  var R = {};
  db.matches.forEach(function(m){
    var v = validSets(m);
    Object.keys(m.players).forEach(function(n){
      var r = R[n] || (R[n] = { sets: 0, won: 0, pts: 0 }), info = m.players[n];
      v.forEach(function(x, i){ var t = teamAt(info, i); if (!t) return; var mine = t === "A" ? 0 : 1;
        r.sets++; r.pts += +x[mine]; if (+x[mine] > +x[1-mine]) r.won++; });
    });
  });
  Object.keys(R).forEach(function(n){
    var r = R[n], ratio = (r.won + 1) / (r.sets + 2), avg = r.sets ? r.pts / r.sets : 22.5;
    r.rating = 0.7 * ratio + 0.3 * Math.max(0, Math.min(1, (avg - 17.5) / 10));
  });
  return R;
}
// Predlog: čim bolj izenačeni ekipi (po razmerju dobljenih setov) in čim manj ponovljenih parov.
function suggestTeams(){
  var names = Object.keys(form.players), n = names.length;
  if (n < 2) return toast("Najprej označi prisotne igralce (✓).", true);
  var R = ratings(), P = pairStats(), rounds = Math.max(1, db.matches.length);
  var rate = names.map(function(nm){ return R[nm] ? R[nm].rating : 0.5; });
  var pc = names.map(function(a){ return names.map(function(b){ var s = P[pairKey(a,b)]; return a === b || !s ? 0 : s.with; }); });
  var sizes = n % 2 ? [Math.ceil(n/2), Math.floor(n/2)] : [n/2];
  // Vrstni red po moči: najboljša dva naj bosta v različnih ekipah, prav tako 3. in 4. itd. (kot izmenično izbiranje).
  var order = names.map(function(_, i){ return i; }).sort(function(a,b){ return rate[b] - rate[a]; });
  var rank = []; order.forEach(function(idx, pos){ rank[idx] = pos; });
  var nTop = Math.ceil(n / 3);
  function score(inA){
    var sa = 0, sb = 0, ca = 0, cb = 0, pen = 0, topA = 0, topB = 0, tier = 0;
    for (var i = 0; i < n; i++) {
      if (inA[i]) { sa += rate[i]; ca++; } else { sb += rate[i]; cb++; }
      if (rank[i] < nTop) { if (inA[i]) topA++; else topB++; }
      for (var j = i + 1; j < n; j++) if (inA[i] === inA[j]) pen += pc[i][j];
    }
    for (var t = 0; t + 1 < n; t += 2) if (inA[order[t]] === inA[order[t+1]]) tier += 1 + (n - t) / n; // višji par šteje več
    var diff = Math.abs(sa/ca - sb/cb);
    return { diff: diff, topA: topA, topB: topB, s: diff * 100 + Math.abs(topA - topB) * 4 + tier * 1.5 + (pen / rounds) * 0.3, ma: sa/ca, mb: sb/cb };
  }
  var cands = [];
  function consider(inA){ var c = 0; for (var i = 0; i < n; i++) c += inA[i]; if (sizes.indexOf(c) < 0) return; var r = score(inA); r.inA = inA.slice(); cands.push(r); }
  if (n <= 16) {
    for (var mask = 0; mask < (1 << (n - 1)); mask++) {           // prvi igralec je vedno v A (simetrija)
      var inA = [1]; for (var i = 1; i < n; i++) inA.push((mask >> (i - 1)) & 1); consider(inA);
    }
  } else {
    for (var t = 0; t < 20000; t++) {
      var idx = names.map(function(_, i){ return i; }).sort(function(){ return Math.random() - .5; });
      var arr = new Array(n).fill(0); idx.slice(0, Math.ceil(n/2)).forEach(function(i){ arr[i] = 1; }); consider(arr);
    }
  }
  cands.sort(function(a,b){ return a.s - b.s; });
  var good = cands.filter(function(c){ return c.s <= cands[0].s + 1.5; }).slice(0, 8);   // le skoraj enako dobri predlogi
  var pick = good[Math.floor(Math.random() * good.length)];                              // naključno, da "znova" da drug predlog
  if (Math.random() < .5) pick.inA = pick.inA.map(function(x){ return 1 - x; });
  names.forEach(function(nm, i){ form.players[nm] = { t: pick.inA[i] ? "A" : "B", j: form.players[nm].j }; });
  var flip = !pick.inA[0];
  var ma = flip ? pick.mb : pick.ma, mb = flip ? pick.ma : pick.mb;
  var ta = flip ? pick.topB : pick.topA, tb = flip ? pick.topA : pick.topB;
  var tops = order.slice(0, nTop).map(function(i){ return esc(names[i]); }).join(", ");
  suggestInfo = "Povprečna moč: <b>" + esc(form.teamA || "A") + " " + fmt(ma,2) + "</b> · <b>" + esc(form.teamB || "B") + " " + fmt(mb,2) + "</b>. "
    + "Najmočnejši (" + tops + ") so razdeljeni " + ta + " : " + tb + ". "
    + '<span class="mute">Moč = 70 % razmerje dobljenih setov + 30 % pike na set; novinec 0,50. Klikni znova za drug predlog ali popravi ročno.</span>';
  render();
}

function winnerOf(m){ var wa = m.sets.filter(function(s){ return s[0] > s[1]; }).length; return wa * 2 > m.sets.length ? "A" : wa * 2 < m.sets.length ? "B" : ""; }
function namesList(arr, max){ return arr.slice(0, max).map(esc).join(", ") + (arr.length > max ? " in še " + (arr.length - max) : ""); }

  var top = Math.max.apply(null, [0].concat(Object.keys(mx).map(function(n){ return mx[n]; })));

  // Kralj jollyja.

    .withSuccessHandler(function(data){ fromServer(data); if (form.auto) newForm(); render(); toast(!ans ? "Odgovor odstranjen" : jolly ? "Hvala, ti si jolly 🍺" : "Odgovor shranjen"); })

  var focusId = document.activeElement && document.activeElement.id;
  var content;
  if (loadErr) content = '<p class="notice">Podatkov ni bilo mogoče naložiti: ' + esc(loadErr) + '</p>';
  else if (!loaded) content = '<p class="notice">Nalagam rezultate …</p>';
  else content = tab === "stat" ? statHTML() : tab === "zgod" ? zgodHTML() : tab === "soig" ? soigHTML() : tab === "home" ? homeHTML() : tab === "pris" ? prisHTML() : tab === "zgpr" ? zgprHTML() : tab === "vnos" ? vnosHTML() : igrHTML();
  var loginForm = showLogin && !canWrite ? '<form class="row" id="loginF"><input type="password" id="pwIn" placeholder="Geslo za vnos" autocomplete="current-password"><button class="btn">Prijava</button><button type="button" class="btn sec" data-act="nologin">Prekliči</button></form>' : "";
  $("#app").innerHTML = '<header class="top"><div class="wrap"><div class="brand"><h1>Odbojka Preserje</h1>'
    + '<span class="hbtns">' + (me
        ? '<button class="mebtn" data-act="whoami" title="Nisi ti? Klikni in izberi svoje ime.">👤 ' + esc(me) + "</button>"
        : '<span class="meunk">Neznan</span><button class="mebtn go" data-act="whoami">Prijavi se</button>')
    + '<button class="qbtn" data-act="theme" aria-label="Zamenjaj temo" title="' + (isDark() ? 'Svetla tema' : 'Temna tema') + '">' + (isDark() ? '☀' : '☾') + '</button>'
    + '<button class="qbtn" data-act="help" aria-label="Pomoč" title="Pomoč">?</button></span>'
    + "</div>"
    + '<div class="hrow2">' + chatFlag()
    + (canWrite ? '<button class="login" data-act="logout">Odjava</button>' : showLogin ? "" : '<button class="login" data-act="showlogin">Vnos rezultatov</button>') + "</div>"
    + loginForm
    + '<nav role="tablist">' + tabs.map(function(t){ return '<button role="tab" data-tab="' + t[0] + '" aria-selected="' + (t[0] === tab) + '">' + t[1] + "</button>"; }).join("") + "</nav></div></header>"
    + '<main class="wrap">' + content + '<p class="mute" style="text-align:center;margin:0">Različica ' + VERSION + "</p></main>"
    + (helpOpen ? helpHTML() : "") + (whoOpen ? whoHTML() : "") + (confirmBox ? confirmHTML() : "");
  var mm = $("#msgs"); if (mm) mm.scrollTop = mm.scrollHeight;   // zadnje sporočilo spodaj
  if (goChat) { goChat = false; var ch = document.querySelector(".chat"); if (ch) ch.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (focusId) { var f = document.getElementById(focusId); if (f) f.focus({ preventScroll: true }); }
  if (showLogin && !canWrite && !focusId) { var pi = $("#pwIn"); if (pi) pi.focus(); }
}

/* ---------- dogodki ---------- */
document.addEventListener("submit", function(e){
  if (e.target.id === "chatF") { e.preventDefault(); sendChat(); return; }
  if (e.target.id === "noteF") { e.preventDefault(); saveNote(); return; }
  if (e.target.id !== "loginF") return;
  e.preventDefault();
  var p = $("#pwIn").value; if (p) login(p);
});
document.addEventListener("click", function(e){
  if (e.target.classList && e.target.classList.contains("modal")) {   // klik na temno ozadje
    if (confirmBox) confirmBox = null; else if (whoOpen) whoOpen = false; else { helpOpen = false; markHelpSeen(); }
    render(); return;
  }
  var b = e.target.closest("button"); if (!b || b.disabled) return;
  var d = b.dataset;
  if (d.pick !== undefined || d.rmset || d.act === "addset" || d.act === "suggest") form.auto = false;
  if (d.tab) { tab = d.tab; pendingDel = null; if (tab === "zgpr") logData = null; render(); return; }
  if (d.ter) { selTer = d.ter; noteDraft = null; render(); return; }
  if (d.rsvp) { sendRsvp(d.who, d.rsvp); return; }
  if (d.hrsvp) { selTer = activeTermin(); sendRsvp(me, d.hrsvp); return; }   // odgovor s Home strani
  if (d.jollyRsvp) { sendRsvp(d.who, "DA", true); return; }
  if (d.iam) { setMe(d.iam); whoOpen = false; markHelpSeen(); toast("Živjo, " + d.iam + "!"); render(); return; }
  if (d.link) {
    var url = db.url + "?tab=prisotnost&jaz=" + encodeURIComponent(d.link);
    var show = function(){ askConfirm("Osebna povezava", "Pošlji jo igralcu <b>" + esc(d.link) + "</b>. Ko jo odpre, ga stran takoj prepozna.<p><input type=\"text\" id=\"linkOut\" readonly value=\"" + esc(url) + "\" style=\"width:100%\"></p>", "Zapri", function(){ render(); });
      setTimeout(function(){ var li = $("#linkOut"); if (li) li.select(); }, 0); };
    try { navigator.clipboard.writeText(url).then(function(){ toast("Povezava za " + d.link + " je kopirana"); }, show); } catch (err) { show(); }
    return;
  }
  if (d.delchat) { call("deleteChat", [pw, d.delchat], "Sporočilo izbrisano", "pris"); return; }
  if (d.skip) { call("setSkip", [pw, d.skip, !isSkipped(d.skip), ""], isSkipped(d.skip) ? "Termin je spet aktiven" : "Termin odpade", "pris"); return; }
  if (d.sort) { if (d.sort === sortKey) sortDir *= -1; else { sortKey = d.sort; sortDir = (d.sort === "name" || d.sort === "pos") ? 1 : -1; } render(); return; }
  if (d.pick !== undefined) { pickPlayer(d.pick, d.t); return; }
  if (d.rmch) { removeCh(d.rmch); return; }
  if (d.rmset) { form.sets.splice(+d.rmset, 1); render(); return; }
  if (d.edit) { form = JSON.parse(JSON.stringify(db.allMatches.filter(function(m){ return m.id === d.edit; })[0])); while (form.sets.length < (form.sets.length ? 3 : 5)) form.sets.push([0,0]); tab = "vnos"; render(); return; }
  if (d.askdel) { pendingDel = d.askdel; render(); return; }
  if (d.del) { pendingDel = null; call("deleteMatch", [pw, d.del], "Tekma izbrisana", "zgod"); return; }
  if (d.pdel) { db.players.splice(+d.pdel, 1); dirty = true; render(); return; }
  switch (d.act) {
    case "gopris": tab = "pris"; selTer = activeTermin(); render(); window.scrollTo(0, 0); break;
    case "reloadlog": loadLog(); break;
    case "cyes": var cf = confirmBox.fn; confirmBox = null; cf(); break;
    case "cno": confirmBox = null; render(); break;
    case "whoami": whoOpen = true; render(); break;
    case "closewho": whoOpen = false; render(); break;
    case "forgetme": setMe(""); whoOpen = false; toast("Aplikacija te ne prepozna več"); render(); break;
    case "help": helpOpen = true; render(); break;
    case "theme": setTheme(isDark() ? "light" : "dark"); render(); break;
    case "closehelp": helpOpen = false; markHelpSeen(); render(); break;
    case "hidebanner": markHelpSeen(); render(); break;
    case "moreter": showAllTer = !showAllTer; render(); break;
    case "gochat": tab = "pris"; selTer = activeTermin(); goChat = true; render(); break;
    case "showlogin": showLogin = true; render(); break;
    case "nologin": showLogin = false; render(); break;
    case "logout": logout(); toast("Odjavljen"); render(); break;
    case "fclr": fOd = fDo = ""; render(); break;
    case "addset": form.sets.push([0,0]); render(); break;
    case "cancel": newForm(); render(); break;
    case "save": saveMatch(); break;
    case "suggest": suggestTeams(); break;
    case "nodel": pendingDel = null; render(); break;
    case "addp":
      var n = $("#newP").value.trim().replace(/,/g, " "); if (!n) return;
      if (db.players.some(function(p){ return p.name.toLowerCase() === n.toLowerCase(); })) return toast("Igralec s tem imenom že obstaja.", true);
      db.players.push({ name: n, active: true, orig: null }); dirty = true; render(); break;
    case "saveplayers": savePlayers(); break;
  }
});
document.addEventListener("input", function(e){
  var t = e.target, d = t.dataset;
  if (t.id === "chatIn") { chatDraft = t.value; return; }
  if (t.id === "noteIn") { noteDraft = t.value; return; }
  if (d.set !== undefined || t.id === "mTA" || t.id === "mTB") form.auto = false;
  if (d.set !== undefined) {
    form.sets[+d.set][+d.x] = +t.value || 0;
    var S = sums(); $("#sumA").textContent = S.a; $("#sumB").textContent = S.b; $("#result").innerHTML = S.res; return;
  }
  if (t.id === "mTA") form.teamA = t.value;
  if (t.id === "mTB") form.teamB = t.value;
});
document.addEventListener("change", function(e){
  var t = e.target, d = t.dataset;
  if (t.id === "logTer") { logTer = t.value; render(); }
  else if (t.id === "logWho") { logWho = t.value; render(); }
  else if (t.id === "meSel") { setMe(t.value); render(); }
  else if (t.id === "pairSel") { pairSel = t.value; render(); }
  else if (t.id === "sortSel") { sortKey = t.value; sortDir = (sortKey === "name" || sortKey === "pos") ? 1 : -1; render(); }
  else if (t.id === "fOd") { fOd = t.value; render(); }
  else if (t.id === "fDo") { fDo = t.value; render(); }
  else if (t.id === "mDate") { form.date = t.value; form.auto = false; }
  else if (t.id === "mTA" || t.id === "mTB") render();
  else if (d.jolly !== undefined) form.players[d.jolly].j = t.checked;
  else if (d.ren !== undefined) {
    var n = t.value.trim().replace(/,/g, " "), p = db.players[+d.ren];
    if (n && !db.players.some(function(q){ return q !== p && q.name.toLowerCase() === n.toLowerCase(); })) { p.name = n; dirty = true; }
    else toast("Ime je prazno ali že obstaja.", true);
    render();
  }
  else if (d.active !== undefined) { db.players[+d.active].active = t.checked; dirty = true; render(); }
});
document.addEventListener("keydown", function(e){ if (e.key === "Escape" && confirmBox) { confirmBox = null; render(); return; } if (e.key === "Escape" && whoOpen) { whoOpen = false; render(); return; } if (e.key === "Escape" && helpOpen) { helpOpen = false; markHelpSeen(); render(); return; } if (e.key === "Enter" && e.target.id === "newP") { var b = document.querySelector('[data-act="addp"]'); if (b) b.click(); } });

var INIT = null;   // podatki, ki jih strežnik vgradi ob odprtju strani (null = naloži posebej)
if (INIT) { try { fromServer(INIT); newForm(); } catch (e) { INIT = null; } }
render();
if (!INIT) load();
// Povezava ...exec?tab=prisotnost ali ...exec#prisotnost odpre neposredno prijave.
if (google.script.url) google.script.url.getLocation(function(l){
  var p = (l && l.parameter && (l.parameter.tab || l.parameter.t)) || "", h = (l && l.hash) || "";
  var jaz = l && l.parameter && l.parameter.jaz;
  if (jaz) { me = jaz; try { localStorage.setItem(ME_KEY, jaz); } catch (e) {} }   // osebna povezava
  else if (me) setMe(me);                                                           // ime iz shrambe prepiši v naslov
  if (/prisot|prijav/i.test(p + h) || jaz) tab = "pris";
  render();
});
if (pw) google.script.run.withSuccessHandler(function(ok){ if (ok) { canWrite = true; render(); } else logout(); }).checkPassword(pw);
})();
</script>
</body>
</html>
